<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Text Editor</title><link rel="icon" href="icon.svg"><link rel="stylesheet" href="ink-ui/ink.css"><link rel="stylesheet" href="style.css"></head><body><header><div class="brand"><img src="icon.svg" width="25" height="25" alt="">Text Editor</div><div class="actions"><button id="new">New</button><button id="open">Open…</button><button id="upload">Upload…</button><button id="save-as">Save As…</button><button id="save" class="primary">Save</button></div></header><div class="document-bar"><div><span id="dirty" aria-label="Unsaved changes" hidden>●</span><strong id="filename">Untitled.txt</strong><small id="saved">New document</small></div><div class="toggles"><button id="find" aria-label="Find in document">⌕ Find</button><button id="wrap" aria-pressed="true">Wrap</button></div></div><div id="find-bar" hidden><input id="find-input" type="search" aria-label="Find in document" placeholder="Find in document"><button id="find-next">Next</button><button id="close-find" aria-label="Close find">×</button><span id="find-result"></span></div><div class="editor-wrap"><pre id="lines" aria-hidden="true">1</pre><button id="recover" hidden>Recover browser draft</button><textarea id="editor" aria-label="Document text" spellcheck="false" wrap="soft" placeholder="A blank page. Make it yours."></textarea></div><div id="status" role="status" aria-live="polite">Connecting to Ink OS…</div><footer><span id="position">Ln 1, Col 1</span><span id="words">0 words · 0 characters</span><span class="encoding">Plain text · UTF-8</span></footer><input id="file-input" type="file" accept="text/*,.txt,.md,.json,.js,.ts,.css,.html,.csv,.ink,.log,.yaml,.yml" hidden><dialog id="save-dialog"><form id="save-form"><h2>Save a new file</h2><label>File name<input id="save-name" value="Untitled.txt" required maxlength="200" autocomplete="off"></label><div><button type="button" id="cancel-save">Cancel</button><button class="primary">Save file</button></div></form></dialog><script src="sdk.js"></script><script type="module" src="editor.js"></script></body></html>
